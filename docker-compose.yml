# =====================================================================
# Projeto 6 - Ovitrampas / GEVACZ  |  Ambiente de desenvolvimento local
# Sobe com:  docker compose up -d
# Derruba:   docker compose down        (os dados do banco continuam)
# Apaga tudo: docker compose down -v    (apaga também o volume = perde os dados!)
# =====================================================================

name: ovitrampas   # prefixo dos nomes de contêiner/rede/volume criados

services:

  # -------------------------------------------------------------------
  # BANCO DE DADOS: PostgreSQL
  # Guarda ovitrampas, coletas, contagens (e, no futuro, contatos de moradores).
  # -------------------------------------------------------------------
  db:
    image: postgres:16-alpine          # versão fixa (16) = todo mundo do grupo roda a mesma
    restart: unless-stopped            # religa sozinho se cair (ou se o PC reiniciar)
    environment:
      # O Compose lê estes valores do arquivo .env (que NÃO vai para o Git).
      # A sintaxe ${VAR:?msg} faz o compose recusar subir se a variável faltar.
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      # formato "ONDE_NO_SEU_PC:ONDE_NO_CONTEINER".
      # 127.0.0.1 na frente = só o SEU computador acessa (ninguém da rede/wifi).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nomeado: a pasta de dados do Postgres vive FORA do contêiner,
      # então apagar/recriar o contêiner não apaga os dados.
      - db_data:/var/lib/postgresql/data
      # Scripts .sql desta pasta rodam UMA vez, na primeira criação do banco vazio.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # "O banco está pronto para aceitar conexões?" - o Docker roda isto a cada 5s.
      # $$ evita que o Compose troque a variável antes de chegar no contêiner.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------
  # FILA: Redis
  # Guarda a "lista de tarefas pendentes" (ex.: "contar ovos da foto nº 42").
  # A API coloca tarefas na fila e o serviço de IA pega uma por vez, em segundo plano.
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # --requirepass: exige senha para qualquer conexão.
    # --appendonly yes: grava cada comando em disco, para a fila sobreviver a um reinício.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}", "--appendonly", "yes"]
    environment:
      # REDISCLI_AUTH faz o "redis-cli" (usado no healthcheck) se autenticar sozinho.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"   # só o seu PC acessa
    volumes:
      - redis_data:/data                       # onde o Redis grava o arquivo da fila
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------
  # ADMINER: tela web para ver as tabelas do banco (ferramenta de dev)
  # Abra http://localhost:8080  (servidor: db)
  # -------------------------------------------------------------------
  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy     # só sobe depois do healthcheck do db passar
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"

  # -------------------------------------------------------------------
  # EXEMPLO (comentado): como um serviço NOSSO entraria aqui depois.
  # Descomente e adapte quando o protótipo da API estiver pronto.
  # -------------------------------------------------------------------
  # api:
  #   build: ./api                      # constrói a imagem a partir do Dockerfile em ./api
  #   restart: unless-stopped
  #   environment:
  #     # Dentro da rede do Compose, o banco é acessado pelo NOME do serviço ("db"),
  #     # e a porta é a de DENTRO (5432), não a que você abriu no seu PC.
  #     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   ports:
  #     - "127.0.0.1:3000:3000"

volumes:
  db_data:    # declara o volume usado pelo db (o Docker cria e gerencia)
  redis_data: # volume do Redis (arquivo de persistência da fila)
